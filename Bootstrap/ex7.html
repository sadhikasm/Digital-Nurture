<!DOCTYPE html>
    <html>
        <head>
            <title>Bootstrap Ex6</title>
            <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
        </head>
        <body>

            <h4>Typography Utilities</h4>

            <div class="container">

                <h1 class="display-1">Display 1 on Heading 1</h1>

                <p class="lead">
                    This is a lead paragraph. It stands out from regular text.
                </p>

                <p class="text-muted">
                    This is muted text used for secondary information.
                </p>

                <p class="fw-bold">
                    This text is bold.
                </p>

                <p class="fst-italic">
                    This text is italic.
                </p>

            </div>

        <br><br>
        <h4>Text Cases</h4>
        <div class="container">

            <p class="text-uppercase">
                bootstrap is easy to learn
            </p>

            <p class="text-lowercase">
                BOOTSTRAP IS EASY TO LEARN
            </p>

            <p class="text-capitalize">
                bootstrap is easy to learn
            </p>

        </div>

        </body>
    </html>
