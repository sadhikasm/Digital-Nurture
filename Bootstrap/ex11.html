<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Cards and Media Objects</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Profile Card</h4>

<div class="container">
    <div class="card" style="width:300px;">
        <img src="https://via.placeholder.com/300x200" class="card-img-top" alt="Profile">

        <div class="card-body">
            <h5 class="card-title">John Doe</h5>
            <p>Web Developer</p>
            <button class="btn btn-primary">View Profile</button>
        </div>
    </div>
</div>

<h4 class="mt-4">Media Object Layout</h4>

<div class="container">
    <div class="d-flex">
        <img src="https://via.placeholder.com/100" class="me-3" alt="Image">

        <div>
            <h5>Article Title</h5>
            <p>
                This is a sample media object layout with the image
                aligned to the left of the content.
            </p>
        </div>
    </div>
</div>

</body>
</html>
