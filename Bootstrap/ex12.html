<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Ex12</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Margin and Padding Utilities</h4>

<div class="container">

    <div class="bg-secondary text-center p-2 m-3">
        <p>Section with p-2 and m-3</p>
    </div>

    <div class="bg-secondary text-center py-5 mt-4">
        <p>Section with py-5 and mt-4</p>
    </div>

</div>

<h4 class="mt-4">Pricing Section</h4>

<div class="container mt-4">

    <div class="row">

        <div class="col-md-4">
            <div class="border p-3 m-2 text-center">
                <h5>Basic</h5>
                <h3>₹499</h3>
                <p>1 Month Access</p>
                <button class="btn btn-primary">Choose Plan</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="border p-3 m-2 text-center">
                <h5>Standard</h5>
                <h3>₹999</h3>
                <p>3 Months Access</p>
                <button class="btn btn-primary">Choose Plan</button>
            </div>
        </div>

        <div class="col-md-4">
            <div class="border p-3 m-2 text-center">
                <h5>Premium</h5>
                <h3>₹1499</h3>
                <p>6 Months Access</p>
                <button class="btn btn-primary">Choose Plan</button>
            </div>
        </div>

    </div>

</div>

</body>
</html>
