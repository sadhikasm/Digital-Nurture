<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Borders and Shadows</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Border Utilities</h4>

<div class="container">
    <img src="https://via.placeholder.com/150"
         class="border border-primary border-3 rounded-circle"
         alt="Profile Image">
</div>

<h4 class="mt-4">Shadow and Rounded Pill</h4>

<div class="container">

    <div class="card shadow p-3 mb-3">
        <h5>Card with Shadow</h5>
        <button class="btn btn-primary rounded-pill">
            Learn More
        </button>
    </div>

    <div class="card shadow-lg p-3">
        <h5>Card with Large Shadow</h5>
        <button class="btn btn-success rounded-pill">
            Get Started
        </button>
    </div>

</div>

</body>
</html>
