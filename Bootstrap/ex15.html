<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Ex15</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Border Utilities</h4>

<div class="container">
    <div class="row">
    <div class="col-3">
        <img src="profes.jpg" style="height:100px;" class="border border-primary border-3 rounded-circle" alt="Profile Image">
    </div>
    <div class="col-9 align-self-center">
        <h5>Sarah James</h5>
        <p>Web Developer</p>
    </div>
    </div>

</div>

<h4 class="mt-4">Shadows and Rounded Pill</h4>

<div class="container">

    <div class="card shadow p-3 mb-3">
        <h5>Card with Shadow</h5>
        <button class="btn btn-primary">
            Normal Button
        </button>
    </div>

    <BR>

    <div class="card shadow-lg p-3">
        <h5>Card with Large Shadow</h5>
        <button class="btn btn-secondary rounded-pill">
            Button with Rounded Pill
        </button>
    </div>

</div>

</body>
</html>
