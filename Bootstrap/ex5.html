<html>
    <head>
        <title>Bootstrap Ex1</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <h4>Justify content and align items at center</h4>
        <div class="container">
            <div class="row justify-content-center align-items-center">
                <div class="col-3 border p-3">Column1</div>
                <div class="col-3 border p-3">Column2</div>
                <div class="col-3 border p-3">Column3</div>
                <div class="col-3 border p-3">Column4</div>
            </div>
        </div>
        <br><br>

        <h4>Reordering Columns</h4>
        <div class="container">
            <div class="row">
                <div class="col-md-6 order-md-2 border p-3">First Column</div>
                <div class="col-md-6 order-md-1 border p-3">Second Column</div>
            </div>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
