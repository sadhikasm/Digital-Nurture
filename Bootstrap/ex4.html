<!doctype=html>
<html>
    <head>
        <title>Bootstrap Ex1</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    </head>
    <body>
        <h4>Two column layout</h4>
        <div class="container">
            <div class="row">
                <div class="col-md-3 border p-3">Sidebar</div>
                <div class="col-md-9 border p-3">Content Area</div>
            </div>

            <div class="row">
                <div class="col-md-3">ListItem1</div>
                <div class="col-md-9">This ia paragraph in the Content area</div>
            </div>
            <div class="row">
                <div class="col-md-3">ListItem2</div>
            </div>
            <div class="row">
                <div class="col-md-3">ListItem3</div>
            </div>
        </div>
        <br><br>
        <h4>Four column layout</h4>
        <div class="container">
            <div class="row">
                <div class="col-sm-3 border p-3">Column1</div>
                <div class="col-sm-3 border p-3">Column2</div>
                <div class="col-sm-3 border p-3">Column3</div>
                <div class="col-sm-3 border p-3">Column4</div>
            </div>
        </div>
    </body>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</html>
