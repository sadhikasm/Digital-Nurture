<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Ex13</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Dashboard Page</h4>

<div class="container mt-3">

    <div class="bg-primary text-white p-3 mb-3">
        bg-primary text-white
    </div>

    <div class="bg-success text-warning p-3 mb-3">
        bg-success text-warning
    </div>

    <div class="bg-warning text-dark p-3 mb-3">
        bg-warning text-dark
    </div>

    <div class="bg-danger text-muted p-3">
        bg-danger text-muted
    </div>

</div>

<h4 class="mt-4">Gradient Background</h4>

<div class="container">
    <div class="bg-dark bg-gradient text-white p-5 text-center">
        bg-gradient with bg-dark
    </div>
</div>

</body>
</html>
