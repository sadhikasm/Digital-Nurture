<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Navigation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Responsive Navbar</h4>

<nav class="navbar navbar-expand-lg navbar-light bg-light">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">Logo</a>

        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#navMenu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navMenu">
            <ul class="navbar-nav me-auto">
                <li class="nav-item">
                    <a class="nav-link" href="#">Home</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">About</a>
                </li>

                <li class="nav-item">
                    <a class="nav-link" href="#">Contact</a>
                </li>
            </ul>

            <form class="d-flex">
                <input type="search" class="form-control me-2" placeholder="Search">
                <button class="btn btn-primary">Search</button>
            </form>
        </div>
    </div>
</nav>

<h4 class="mt-4">nav, nav-tabs and nav-pills</h4>

<div class="container">

    <h5>Simple Nav</h5>
    <ul class="nav">
        <li class="nav-item"><a class="nav-link" href="#">Home</a></li>
        <li class="nav-item"><a class="nav-link" href="#">About</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Contact</a></li>
    </ul>

    <h5 class="mt-3">Nav Tabs</h5>
    <ul class="nav nav-tabs">
        <li class="nav-item"><a class="nav-link active" href="#">Tab 1</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Tab 2</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Tab 3</a></li>
    </ul>

    <h5 class="mt-3">Nav Pills</h5>
    <ul class="nav nav-pills">
        <li class="nav-item"><a class="nav-link active" href="#">Pill 1</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Pill 2</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Pill 3</a></li>
    </ul>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
