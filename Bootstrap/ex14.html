<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Ex14</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Display Utilities</h4>

<div class="container">

    <div class="bg-danger text-white p-3 mb-3">
        Always Visible
    </div>

    <div class="bg-warning p-3 mb-3 d-none d-md-block">
        Visible on Medium Screens and Above
    </div>

    <div class="bg-success text-white p-3 d-none d-lg-flex">
        Visible as Flex on Large Screens and Above
    </div>

</div>

<h4 class="mt-4">Responsive Sidebar</h4>

<div>
    <div class="row">

        <div class="col-md-3 col-sm-6 bg-dark text-white p-3 d-none d-sm-block">
            <h5>Sidebar</h5>
            <p>Dashboard</p>
            <p>Profile</p>
            <p>Logout</p>
        </div>

        <div class="col-md-9 col-sm-6 p-3">
            <h5>Main Content</h5>
            <p>This content is visible on all screen sizes.</p>
        </div>

    </div>
</div>

</body>
</html>
