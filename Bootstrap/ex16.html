<!DOCTYPE html>
<html>
<head>
    <title>Bootstrap Position Utilities</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<h4>Fixed Footer</h4>

<div class="container">
    <p>Sample content goes here.</p>
</div>

<footer class="position-fixed bottom-0 w-100 bg-dark text-white text-center p-2">
    Fixed Footer
</footer>

<h4 class="mt-4">Image with Badge Overlay</h4>

<div class="container mt-3">

    <div class="position-relative d-inline-block">
        <img src="https://via.placeholder.com/200" alt="Image">

        <span class="badge bg-danger position-absolute top-0 start-100 translate-middle">
            New
        </span>
    </div>

</div>

</body>
</html>
